<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/image/logo.jpg" type="image/jpeg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 패널</title>
    <link rel="stylesheet" href="ML/manager.css">
    <script>
  (function() {
    // 세션 스토리지에서 열쇠가 있는지 확인
    const auth = sessionStorage.getItem('adminAuth');

    if (auth !== 'authorized') {
      // 열쇠가 없으면 경고창을 띄우고 로그인 페이지로 강제 이동
      alert('접근 권한이 없습니다. 게임센터로 돌아갑니다.');
      location.replace('ina.html'); // .href 대신 .replace를 쓰면 뒤로가기가 방지됩니다.
    }
  })();
</script>
</head>
<body>
    <div class="admin-panel">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>📊 관리자 패널</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-btn active" data-tab="suggestions">건의사항 검토</button>
                <button class="nav-btn" data-tab="add-problem">문제 추가</button>
                <button class="nav-btn" data-tab="edit-problem">문제 수정</button>
                <button class="nav-btn" data-tab="ranking">랭킹 관리</button>
                <button class="nav-btn" data-tab="admin-logs">관리자 로그</button>
            </nav>
            <div class="sidebar-footer">
                <a href="ina.html" class="logout-btn">← 돌아가기</a>
            </div>
        </div>

        <div class="content">
            <!-- 건의사항 검토 탭 -->
            <section id="suggestions" class="tab-content active">
                <h1>건의사항 검토</h1>
                <div id="suggestionsList" class="list-container">
                    <p class="loading">로딩 중...</p>
                </div>
            </section>

            <!-- 문제 추가 탭 -->
            <section id="add-problem" class="tab-content">
                <h1>새로운 문제 추가</h1>
                <form id="addProblemForm" class="problem-form">
                    <div class="form-group">
                        <label for="newQuestionText">문제</label>
                        <textarea id="newQuestionText" placeholder="문제를 입력하세요" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="newAnswer">정답</label>
                        <input id="newAnswer" type="text" placeholder="정답을 입력하세요" required>
                    </div>
                    <div class="form-group">
                        <label for="newAnswer2">추가 정답 2 (선택)</label>
                        <input id="newAnswer2" type="text" placeholder="추가 정답을 입력하세요">
                    </div>
                    <div class="form-group">
                        <label for="newAnswer3">추가 정답 3 (선택)</label>
                        <input id="newAnswer3" type="text" placeholder="추가 정답을 입력하세요">
                    </div>
                    <div class="form-group">
                        <label for="newDifficulty">난이도</label>
                        <select id="newDifficulty" required>
                            <option value="">선택하세요</option>
                            <option value="easy">쉬움</option>
                            <option value="medium">보통</option>
                            <option value="hard">어려움</option>
                            <option value="Hardcore">하드코어</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">문제 추가</button>
                </form>
                <div id="addProblemStatus" class="status-msg"></div>
            </section>

            <!-- 문제 수정 탭 -->
            <section id="edit-problem" class="tab-content">
                <h1>문제 관리 및 수정</h1>
                
                <div class="filter-group">
                    <label for="existingDifficulty">난이도:</label>
                    <select id="existingDifficulty">
                        <option value="">모든 난이도</option>
                        <option value="easy">쉬움</option>
                        <option value="medium">보통</option>
                        <option value="hard">어려움</option>
                        <option value="Hardcore">하드코어</option>
                    </select>
                </div>
                <div id="existingProblemList" class="list-container">
                    <p class="loading">로딩 중...</p>
                </div>
            </section>

            <!-- 랭킹 관리 탭 -->
            <section id="ranking" class="tab-content">
                <h1>랭킹 관리</h1>
                <div class="ranking-filters">
                    <select id="rankingDifficulty">
                        <option value="easy">쉬움</option>
                        <option value="medium">보통</option>
                        <option value="hard">어려움</option>
                        <option value="Hardcore">하드코어</option>
                    </select>
                </div>
                <div id="rankingList" class="list-container">
                    <p class="loading">로딩 중...</p>
                </div>
            </section>

            <!-- 관리자 로그 탭 -->
            <section id="admin-logs" class="tab-content">
                <h1>관리자 로그</h1>
                <div class="filter-group">
                    <label for="logActionFilter">작업</label>
                    <select id="logActionFilter">
                        <option value="">전체</option>
                        <option value="QUIZ_SUGGESTION_APPROVE">퀴즈 건의 승인</option>
                        <option value="QUIZ_SUGGESTION_REJECT">퀴즈 건의 기각</option>
                        <option value="QUIZ_CREATE">퀴즈 추가</option>
                        <option value="QUIZ_UPDATE">퀴즈 수정</option>
                        <option value="QUIZ_DELETE">퀴즈 삭제</option>
                        <option value="QUIZ_RANKING_DELETE">랭킹 삭제</option>
                        <option value="QUIZ_RANKING_DELETE_ALL">랭킹 전체 삭제</option>
                        <option value="CONCERT_CREATE">콘서트 추가</option>
                        <option value="CONCERT_UPDATE">콘서트 수정</option>
                        <option value="CONCERT_DELETE">콘서트 삭제</option>
                        <option value="GOODS_CREATE">굿즈 추가</option>
                        <option value="GOODS_UPDATE">굿즈 수정</option>
                        <option value="GOODS_DELETE">굿즈 삭제</option>
                        <option value="NOTICE_CREATE">공지 추가</option>
                        <option value="NOTICE_UPDATE">공지 수정</option>
                        <option value="NOTICE_DELETE">공지 삭제</option>
                        <option value="CONFIG_UPDATE">설정 변경</option>
                        <option value="WAITING_CREATE">대기그룹 추가</option>
                        <option value="WAITING_UPDATE">대기그룹 수정</option>
                        <option value="WAITING_DELETE">대기그룹 삭제</option>
                        <option value="DISCORD_NOTICE_SEND">디스코드 공지 전송</option>
                        <option value="DISCORD_NOTIFY_CONCERT">디스코드 일정 알림</option>
                        <option value="DISCORD_NOTIFY_KARAOKE_PENDING">디스코드 노래방 알림</option>
                        <option value="KARAOKE_NUMBER_CREATE">노래방 번호 추가</option>
                        <option value="KARAOKE_PENDING_APPROVE">노래방 등록요청 승인</option>
                        <option value="KARAOKE_PENDING_REJECT">노래방 등록요청 기각</option>
                    </select>
                    <label for="logStatusFilter">결과</label>
                    <select id="logStatusFilter">
                        <option value="">전체</option>
                        <option value="success">성공</option>
                        <option value="failed">실패</option>
                    </select>
                </div>
                <div id="adminLogsList" class="list-container">
                    <p class="loading">로딩 중...</p>
                </div>
            </section>
        </div>
    </div>

    <script src="ML/manager.js"></script>
</body>
</html>
